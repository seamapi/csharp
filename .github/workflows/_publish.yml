---
name: _publish

on:
  workflow_call:
    inputs:
      artifact_name:
        description: The artifact name.
        type: string
        required: true
      registry_url:
        description: The package registry url.
        type: string
        required: true
      registry_user:
        description: The registry user for trusted publishing.
        type: string
        required: false
        default: ''
    secrets:
      registry_token:
        description: The package registry token.
        required: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          install_dependencies: 'false'
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: pkg/
      - name: Log in with trusted publishing
        if: inputs.registry_user != ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.registry_user }}
      - name: Publish
        run: dotnet nuget push "pkg/*.nupkg" --api-key "$REGISTRY_TOKEN" --source "$REGISTRY_URL"
        env:
          REGISTRY_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY || secrets.registry_token }}
          REGISTRY_URL: ${{ inputs.registry_url }}
